# PO-07 staging — PROPOSED 25 Nov 2026 (owner review): a task cap for THIS cluster's unit only (drop-in 20-tasks.conf).
# On the VPS only through an owner-authorized `tools/reconcile.sh --execute`, then a restart of this cluster's unit.
# Derived from this cluster's own configuration (pg-10-staging.conf; PostgreSQL 16 defaults otherwise), one task each:
#   postmaster 1 + auxiliary processes 5 (checkpointer, background writer, WAL writer, autovacuum launcher, logical
#   replication launcher; 6 tasks measured at idle) + max_connections 30 + autovacuum_max_workers 3 +
#   max_worker_processes 8 (parallel query) = 47 at full configured capacity; + pg_ctlcluster's start/stop helpers 3
#   = 50. 64 leaves 14 for connection attempts beyond max_connections, each forked before PostgreSQL refuses it.
# So PostgreSQL's own limits always bind first (a client beyond max_connections gets "too many clients"); the cap
# stops only a runaway beyond the configuration from taking the slice's tasks from the two app units.
[Service]
TasksMax=64
